<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30BEFF"/>
      <stop offset="100%" stop-color="#0575FD"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="16" fill="#000A23"/>
  <rect x="4" y="4" width="92" height="92" rx="14" fill="none" stroke="#1C4B75" stroke-width="1"/>
  <!-- Bars -->
  <rect x="18" y="60" width="12" height="22" rx="2" fill="url(#g)" filter="url(#glow)"/>
  <rect x="34" y="42" width="12" height="40" rx="2" fill="url(#g)" filter="url(#glow)"/>
  <rect x="50" y="50" width="12" height="32" rx="2" fill="url(#g)" filter="url(#glow)"/>
  <rect x="66" y="30" width="12" height="52" rx="2" fill="url(#g)" filter="url(#glow)"/>
  <!-- Trend line -->
  <polyline points="24,56 40,38 56,46 72,26" fill="none" stroke="#08CBF9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="24" cy="56" r="3" fill="#08CBF9"/>
  <circle cx="40" cy="38" r="3" fill="#08CBF9"/>
  <circle cx="56" cy="46" r="3" fill="#08CBF9"/>
  <circle cx="72" cy="26" r="3" fill="#08CBF9"/>
  <!-- Label -->
  <text x="50" y="94" text-anchor="middle" fill="#79F2FA" font-size="8" font-family="sans-serif" font-weight="600">COST ADVISOR</text>
</svg>
